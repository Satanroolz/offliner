# Shopify Ruby style: https://ruby-style-guide.shopify.dev/
inherit_gem:
  rubocop-shopify: rubocop.yml

AllCops:
  NewCops: enable
  Exclude:
    - "db/schema.rb"
    - "tmp/**/*"
    - "vendor/**/*"
    - "node_modules/**/*"

# The rubocop-shopify gem disables these, but the style guide asks for them.
Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/TrailingCommaInArrayLiteral:
  Enabled: true
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInHashLiteral:
  Enabled: true
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInArguments:
  Enabled: true
  EnforcedStyleForMultiline: comma
